<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaggle Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*,*::before,*::after{font-family:'Press Start 2P',monospace!important}
:root{--ink:#18221e;--paper:#fffdf7;--cream:#f7f2e6;--mint:#cfe8bd;--red:#a63d48;--gold:#e8b84d;--muted:#66736b;--line:#18221e22}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 system-ui,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{padding:28px 20px;background:var(--ink);color:var(--paper)}.logo{font-weight:900;letter-spacing:.25em;color:var(--mint);margin:0 0 45px}.side p{color:#ffffff88;font-size:.82rem}.side button{width:100%;margin-top:30px;padding:11px;border:1px solid #ffffff33;border-radius:10px;background:transparent;color:var(--paper);cursor:pointer}.main{padding:42px 5%;max-width:1280px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.top h1{font-size:clamp(2rem,4vw,3.5rem);margin:0;letter-spacing:-.06em}.eyebrow{color:var(--red);letter-spacing:.2em;text-transform:uppercase;font-size:.7rem;font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 10px 30px #18221e0d}.metric strong{display:block;font-size:2rem;color:var(--red)}.metric span{color:var(--muted);font-size:.8rem}.panel{margin-top:24px}.panel h2{margin-top:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:.75rem;text-transform:uppercase}.status{color:var(--red);font-weight:700}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--mint)}.login-card{width:min(420px,100%);padding:36px;background:var(--paper);border-radius:22px;box-shadow:0 24px 70px #18221e22}.login-card h1{font-size:2.5rem;letter-spacing:-.06em;margin:8px 0 28px}.field{display:block;margin:18px 0}.field span{display:block;margin-bottom:7px;font-weight:700}.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}.button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--red);color:white;font-weight:800;cursor:pointer}.message{margin:15px 0;color:var(--red);min-height:22px}.hidden{display:none!important}@media(max-width:800px){.shell{display:block}.side{padding:18px 5%;display:flex;align-items:center;justify-content:space-between}.logo{margin:0}.side p,.side button{display:none}.main{padding:30px 5%}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<section id="login-view" class="login"><form id="login-form" class="login-card"><div class="eyebrow">PRIVATE AREA</div><h1>Gaggle Admin</h1><label class="field"><span>Username</span><input name="username" autocomplete="username" required></label><label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label><div id="login-message" class="message" role="alert"></div><button class="button" type="submit">Sign in</button></form></section>
<section id="dashboard-view" class="shell hidden"><aside class="side"><div><h2 class="logo">GAGGLE</h2><p>Whitelist operations</p></div><button id="logout">Sign out</button></aside><main class="main"><div class="top"><div><div class="eyebrow">CONTROL ROOM</div><h1>Dashboard</h1></div></div><div id="metrics" class="cards"></div><section class="panel"><h2>Recent applications</h2><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Wallet</th><th>Status</th><th>Created</th></tr></thead><tbody id="applications"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></section></main></section>
<script>
const $=s=>document.querySelector(s),json=async(url,options={})=>{const r=await fetch(url,{credentials:'same-origin',...options});const data=await r.json();if(!r.ok)throw new Error(data.message||'Request failed');return data};
function showDashboard(){ $('#login-view').classList.add('hidden');$('#dashboard-view').classList.remove('hidden');loadDashboard() }
async function loadDashboard(){try{const [dash,apps]=await Promise.all([json('/api/dashboard'),json('/api/applications?limit=10')]);const s=dash.stats||{};$('#metrics').innerHTML=[['Total',s.total],['Pending',s.pending],['Approved',s.approved],['Today',s.today]].map(x=>`<div class="metric"><strong>${x[1]??0}</strong><span>${x[0]} applications</span></div>`).join('');$('#applications').innerHTML=(apps.applications||[]).map(a=>`<tr><td>${a.application_id}</td><td>${a.wallet_address.slice(0,8)}…${a.wallet_address.slice(-4)}</td><td class="status">${a.status}</td><td>${new Date(a.created_at).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan="4">No applications yet.</td></tr>'}catch(e){if(e.message.includes('Authentication')){location.reload()}else alert(e.message)}}
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();const form=new FormData(e.currentTarget);$('#login-message').textContent='';try{await json('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(form))});showDashboard()}catch(error){$('#login-message').textContent=error.message}});
$('#logout').addEventListener('click',async()=>{await json('/api/auth/logout',{method:'POST',headers:{'X-CSRF-Token':'session'}}).catch(()=>{});location.reload()});
loadDashboard().catch(()=>{});
</script>
</body>
</html>
