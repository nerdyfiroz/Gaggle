<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaggle Admin</title>
<link rel="icon" type="image/jpeg" href="/assets/images/hero-pfp.jpg">
<link rel="apple-touch-icon" href="/assets/images/hero-pfp.jpg">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap');
:root{--ink:#18221e;--paper:#fffdf7;--cream:#f7f2e6;--mint:#cfe8bd;--red:#a63d48;--muted:#66736b;--line:#18221e22}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 'DM Sans',sans-serif}.hidden{display:none!important}.shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{padding:28px 20px;background:var(--ink);color:var(--paper)}.logo{font:700 1.25rem 'Space Grotesk';letter-spacing:.25em;color:var(--mint);margin:0 0 45px}.side p{color:#ffffff88;font-size:.85rem}.side button,.button{border-radius:9px;padding:11px 16px;cursor:pointer;font:600 13px 'DM Sans'}.side button{width:100%;margin-top:30px;background:transparent;color:var(--paper);border:1px solid #ffffff33}.main{padding:42px 5%;max-width:1450px;width:100%}.top{margin-bottom:28px}.top h1{font:700 clamp(2rem,4vw,3.5rem)/1 'Space Grotesk';margin:0}.eyebrow{color:var(--red);letter-spacing:.2em;text-transform:uppercase;font-size:.7rem;font-weight:700}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.metric,.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 10px 30px #18221e0d}.metric strong{display:block;font-size:2rem;color:var(--red)}.metric span,.small{color:var(--muted);font-size:.8rem}.panel{margin-top:24px}.panel h2{margin-top:0;font-family:'Space Grotesk'}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-size:.72rem;text-transform:uppercase;white-space:nowrap}.status,.slot{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px;color:var(--ink);font:inherit;font-size:.8rem}.slot{width:92px}.button{border:0;background:var(--red);color:#fff}.button.secondary{background:var(--mint);color:var(--ink)}.button.danger{background:transparent;color:var(--red);border:1px solid #a63d4844}.task-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.task-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}.task-card h3{margin:0 0 8px;font-family:'Space Grotesk'}.task-card p{color:var(--muted);min-height:42px}.task-meta{color:var(--muted);font-size:.78rem;margin-bottom:14px}.task-actions,.form-actions{display:flex;gap:8px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px;color:var(--muted);font-size:.8rem}.field.full{grid-column:1/-1}.field input,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit}.field textarea{min-height:80px;resize:vertical}.check{display:flex;gap:8px;align-items:center;font-size:.85rem}.form-actions{margin-top:14px}.message{min-height:22px;color:var(--red);margin:10px 0}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--mint)}.login-card{width:min(420px,100%);padding:36px;background:var(--paper);border-radius:22px;box-shadow:0 24px 70px #18221e22}.login-card h1{font:700 2.5rem 'Space Grotesk';margin:8px 0 28px}.login-card .field{margin:18px 0}.login-card .button{width:100%;margin-top:8px}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.logo{margin:0}.side p{display:none}.side button{width:auto;margin:0}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.cards,.form-grid{grid-template-columns:1fr}.panel{padding:16px}.panel-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<section id="login-view" class="login"><form id="login-form" class="login-card"><div class="eyebrow">PRIVATE AREA</div><h1>Gaggle Admin</h1><label class="field"><span>Username</span><input name="username" autocomplete="username" required></label><label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label><div id="login-message" class="message" role="alert"></div><button class="button" type="submit">Sign in</button></form></section>
<section id="dashboard-view" class="shell hidden"><aside class="side"><div><h2 class="logo">GAGGLE</h2><p>Whitelist operations</p></div><button id="logout">Sign out</button></aside><main class="main"><div class="top"><div class="eyebrow">CONTROL ROOM</div><h1>Dashboard</h1></div><div id="metrics" class="cards"></div>
<section class="panel"><div class="panel-head"><h2>Applications & whitelist slots</h2><button class="button secondary" id="refresh">Refresh</button></div><p class="small">Assign a unique slot number to approve an applicant. Leave it blank to remove an assignment.</p><div id="app-message" class="message"></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Wallet</th><th>X</th><th>Status</th><th>Slot</th><th>Created</th></tr></thead><tbody id="applications"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section>
<section class="panel"><div class="panel-head"><h2>Task management</h2><button class="button" id="new-task">New task</button></div><form id="task-form" class="hidden"><input type="hidden" name="id"><div class="form-grid"><label class="field"><span>Title</span><input name="title" required></label><label class="field"><span>Action type</span><select name="type"><option value="twitter_follow">Follow</option><option value="twitter_like">Like</option><option value="twitter_retweet">Retweet</option><option value="twitter_reply">Reply</option><option value="custom">Custom</option></select></label><label class="field full"><span>Description</span><textarea name="description"></textarea></label><label class="field full"><span>Action link</span><input name="url" type="url" placeholder="https://x.com/..." required></label><label class="field"><span>Sort order</span><input name="sort_order" type="number" value="0"></label><label class="check"><input name="required" type="checkbox" checked> Required task</label><label class="check"><input name="enabled" type="checkbox" checked> Visible to applicants</label></div><div class="form-actions"><button class="button" type="submit">Save task</button><button class="button danger" type="button" id="cancel-task">Cancel</button></div></form><div id="task-message" class="message"></div><div id="tasks" class="task-grid">Loading…</div></section>
<section class="panel"><h2>Whitelist settings</h2><form id="settings-form"><div style="margin:12px 0"><label class="check"><input name="applications_enabled" type="checkbox"> Whitelist submissions open</label></div><div class="form-actions"><button class="button" type="submit">Save settings</button></div><div id="settings-message" class="message"></div></form></section>
</main></section>
<script>
const $=s=>document.querySelector(s),csrf=()=>decodeURIComponent(document.cookie.split('; ').find(r=>r.startsWith('gaggle_csrf='))?.split('=')[1]||''),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),api=async(url,opt={})=>{const headers={...(opt.headers||{})};if(opt.method&&opt.method!=='GET')headers['X-CSRF-Token']=csrf();const r=await fetch(url,{credentials:'same-origin',...opt,headers}),d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');return d};
function show(){ $('#login-view').classList.add('hidden');$('#dashboard-view').classList.remove('hidden');loadAll() }async function loadAll(){await Promise.all([dashboard(),applications(),tasks(),settings()])}async function dashboard(){const d=await api('/api/dashboard'),s=d.stats||{};$('#metrics').innerHTML=[['Total',s.total],['Pending',s.pending],['Approved',s.approved],['Assigned',s.assigned],['Unique Wallets',s.unique_wallets??s.total]].map(x=>`<div class="metric"><strong>${esc(x[1])}</strong><span>${x[0]} ${x[0]==='Assigned'?'slots':(x[0]==='Unique Wallets'?'wallets':'applications')}</span></div>`).join('')}
async function applications(){try{const d=await api('/api/applications?limit=100');$('#applications').innerHTML=(d.applications||[]).map(a=>`<tr><td>${esc(a.application_id)}</td><td title="${esc(a.wallet_address)}">${esc(a.wallet_address.slice(0,8))}…${esc(a.wallet_address.slice(-4))}</td><td>${a.twitter_username?'@'+esc(a.twitter_username):'—'}</td><td><select class="status" data-id="${a.id}"><option ${a.status==='pending'?'selected':''}>pending</option><option ${a.status==='review'?'selected':''}>review</option><option ${a.status==='approved'?'selected':''}>approved</option><option ${a.status==='rejected'?'selected':''}>rejected</option><option ${a.status==='blacklisted'?'selected':''}>blacklisted</option></select></td><td><input class="slot" data-id="${a.id}" type="number" min="1" value="${a.whitelist_slot??''}" placeholder="—"></td><td>${new Date(a.created_at).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan="6">No applications yet.</td></tr>';document.querySelectorAll('.status').forEach(e=>e.onchange=()=>status(e));document.querySelectorAll('.slot').forEach(e=>e.onchange=()=>slot(e))}catch(e){$('#app-message').textContent=e.message}}async function status(e){try{await api('/api/applications/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:e.dataset.id,status:e.value})})}catch(err){$('#app-message').textContent=err.message;applications()}}async function slot(e){try{await api('/api/applications/slot',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:e.dataset.id,slot:e.value})});dashboard()}catch(err){$('#app-message').textContent=err.message;applications()}}
async function tasks(){const d=await api('/api/tasks');$('#tasks').innerHTML=(d.tasks||[]).map(t=>`<article class="task-card"><h3>${esc(t.title)}</h3><p>${esc(t.description||'No description')}</p><div class="task-meta">${t.enabled?'Visible':'Hidden'} · ${t.required?'Required':'Optional'} · ${esc(t.type)}</div><div class="task-actions"><button class="button secondary edit" data-task="${esc(JSON.stringify(t))}">Edit</button><button class="button danger del" data-id="${t.id}">Delete</button></div></article>`).join('')||'<p class="small">No tasks yet.</p>';document.querySelectorAll('.edit').forEach(e=>e.onclick=()=>edit(JSON.parse(e.dataset.task)));document.querySelectorAll('.del').forEach(e=>e.onclick=()=>del(e.dataset.id))}function edit(t){const f=$('#task-form');f.classList.remove('hidden');['id','title','type','description','url','sort_order'].forEach(k=>f.elements[k].value=t[k]??'');f.elements.required.checked=t.required;f.elements.enabled.checked=t.enabled}async function del(id){if(!confirm('Delete this task?'))return;try{await api(`/api/tasks?id=${id}`,{method:'DELETE'});tasks()}catch(e){$('#task-message').textContent=e.message}}
async function settings(){const d=await api('/api/settings'),s=Object.fromEntries(d.settings.map(x=>[`${x.setting_group}.${x.setting_key}`,x.setting_value]));$('#settings-form').elements.applications_enabled.checked=s['application.applications_enabled']!=='0'}
$('#login-form').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});show()}catch(err){$('#login-message').textContent=err.message}};$('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'}).catch(()=>{});location.reload()};$('#refresh').onclick=loadAll;$('#new-task').onclick=()=>{$('#task-form').reset();$('#task-form').elements.id.value='';$('#task-form').classList.remove('hidden')};$('#cancel-task').onclick=()=>$('#task-form').classList.add('hidden');
$('#task-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,d=Object.fromEntries(new FormData(f));d.required=f.elements.required.checked;d.enabled=f.elements.enabled.checked;try{await api('/api/tasks',{method:f.elements.id.value?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});f.classList.add('hidden');tasks()}catch(err){$('#task-message').textContent=err.message}};$('#settings-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;try{await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({group:'application',settings:{applications_enabled:f.elements.applications_enabled.checked?'1':'0'}})});$('#settings-message').textContent='Settings saved.';dashboard()}catch(err){$('#settings-message').textContent=err.message}};api('/api/dashboard').then(show).catch(()=>{});
</script>
</body>
</html>
